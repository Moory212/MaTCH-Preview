/* ---------- Auth screen ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.02fr .98fr;background:var(--paper)}
.auth-side{background:#183d4d;color:#fff;padding:52px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side:after{content:"";position:absolute;right:-120px;bottom:-120px;width:340px;height:340px;border:1px solid #2c5b6b;border-radius:50%;box-shadow:0 0 0 40px #1e4757,0 0 0 80px #214d5d;opacity:.5}
.auth-side>*{position:relative;z-index:1}
.auth-side .brand{padding:0}
.auth-points{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:12px;max-width:400px}
.auth-points li{font-size:13px;color:#c6dcdf;padding-left:26px;position:relative;line-height:1.55}
.auth-points li:before{content:"✓";position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;background:#2c5a68;color:#b9ded4;font-size:10px;display:grid;place-items:center}
.auth-main{display:grid;place-items:center;padding:40px 28px}
.auth-card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:var(--shadow)}
.auth-tabs{display:flex;background:#f0f3f0;border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:22px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:9px 11px;border-radius:6px;color:var(--muted);font-size:12px;font-weight:600}
.auth-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #193d4d14;font-weight:700}
.auth-role{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.auth-role button{border:1px solid #dce3df;background:#fff;border-radius:9px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:.15s}
.auth-role button strong{font-size:12px;color:var(--ink)}
.auth-role button span{font-size:10px;color:var(--muted);line-height:1.35}
.auth-role button.selected{border-color:var(--blue);background:#eef4f2;box-shadow:inset 0 0 0 1px var(--blue)}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--line);flex:1}
.auth-quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.auth-quick .btn{width:100%}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:62px}
.pass-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--blue);font-size:10px;font-weight:700;letter-spacing:.4px;padding:5px 9px;border-radius:6px;line-height:1}
.pass-toggle:hover{background:#eef4f2}
.field input.invalid,.field select.invalid,.field textarea.invalid{border-color:#c97b6f;background:#fdf6f5}
.field-error{color:#a4473d;font-size:11px;line-height:1.35}
.auth-demo-creds{margin-top:16px;padding:12px 14px;background:#f4f7f5;border:1px solid var(--line);border-radius:9px;font-size:11px;color:#50616a;line-height:1.7}
.auth-demo-creds strong{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.auth-demo-creds code{background:#e7efec;color:#2e5f55;padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
.auth-admin{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.auth-admin .footnote{margin:0}
.auth-admin .btn{padding:4px 0;font-size:11px}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-side{padding:32px 24px}.auth-side h1{font-size:26px!important}.auth-points{display:none}.auth-main{padding:24px 16px 48px}}

/* ---------- Notifications ---------- */
.bell-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none;border:1.5px solid #fff}
.bell-dot.on{display:block}

/* ---------- Compare ---------- */
.btn.compared{background:#e7f0ec;border-color:#bcd6cc;color:var(--green)}
.compare-dock{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;background:#173d4c;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 14px 34px #102d3840;font-size:12px;max-width:calc(100vw - 32px)}
.compare-dock .compare-count{font-weight:700;white-space:nowrap}
.compare-chips{display:flex;gap:5px;flex-wrap:wrap}
.compare-chips .tag{background:#2c5563;border-color:#3a6270;color:#d7ebe6;padding:4px 8px}
@media(max-width:760px){.compare-dock{bottom:74px;padding:9px 11px;font-size:11px}.compare-dock .compare-chips{display:none}}
.cmp-table{width:100%;border-collapse:collapse;font-size:12px}
.cmp-table th,.cmp-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp-table th{font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;width:132px}
.cmp-table td{min-width:150px}
.cmp-table thead td{border-bottom:1px solid var(--line);padding-bottom:14px}

/* ---------- Reviews ---------- */
.review{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #edf0ee}
.review:last-child{border-bottom:0;padding-bottom:0}
.review .avatar{width:34px;height:34px;font-size:11px}
.review-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;flex-wrap:wrap}
.review p{font-size:12px;margin:4px 0 0;color:#596a70;line-height:1.6}
.stars{color:#c8871f;font-size:11px;letter-spacing:1.5px}

/* ---------- Motion (visuals unchanged) ---------- */
@keyframes mFadeIn{from{opacity:0}to{opacity:1}}
@keyframes mFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes mFadeScale{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes mPop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes mDockIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes mGrowBar{from{width:0}}
@keyframes mPulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.65}}
@keyframes mBellRing{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(9deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}

.content{animation:mFadeIn .2s ease backwards}
.content > *{animation:mFadeUp .32s cubic-bezier(.2,.7,.3,1) backwards}
.content > *:nth-child(2){animation-delay:.045s}
.content > *:nth-child(3){animation-delay:.09s}
.content > *:nth-child(4){animation-delay:.13s}
.content > *:nth-child(5){animation-delay:.17s}
.content > *:nth-child(6){animation-delay:.2s}
.content > *:nth-child(n+7){animation-delay:.22s}

.associate-list .associate-card{animation:mFadeUp .3s cubic-bezier(.2,.7,.3,1) backwards}
.associate-list .associate-card:nth-child(1){animation-delay:.02s}
.associate-list .associate-card:nth-child(2){animation-delay:.055s}
.associate-list .associate-card:nth-child(3){animation-delay:.09s}
.associate-list .associate-card:nth-child(4){animation-delay:.12s}
.associate-list .associate-card:nth-child(5){animation-delay:.15s}
.associate-list .associate-card:nth-child(n+6){animation-delay:.17s}
.list .list-row{animation:mFadeUp .28s ease backwards}
.list .list-row:nth-child(2){animation-delay:.04s}
.list .list-row:nth-child(3){animation-delay:.08s}
.list .list-row:nth-child(4){animation-delay:.11s}
.list .list-row:nth-child(n+5){animation-delay:.14s}
.grid.stats .stat{animation:mFadeUp .3s ease backwards}
.grid.stats .stat:nth-child(2){animation-delay:.05s}
.grid.stats .stat:nth-child(3){animation-delay:.1s}
.grid.stats .stat:nth-child(4){animation-delay:.14s}
.dashboard-grid > .panel{animation:mFadeUp .32s ease backwards}
.dashboard-grid > .panel:nth-child(2){animation-delay:.06s}
.profile-layout > *{animation:mFadeUp .32s ease backwards}
.profile-layout > *:nth-child(2){animation-delay:.06s}
.request-card{animation:mFadeUp .28s ease backwards}

.btn{transition:background .15s,transform .15s,box-shadow .2s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.nav button{transition:background .16s,color .16s,transform .16s,box-shadow .16s}
.nav button:hover{transform:translateX(2px)}
.iconbtn{transition:background .15s,transform .15s,border-color .15s}
.iconbtn:hover{background:#f4f7f5;transform:translateY(-1px)}
#bellBtn:hover svg{animation:mBellRing .7s ease backwards}
.associate-card,.stat,.panel,.request-card{transition:border-color .18s,transform .18s,box-shadow .22s}
.stat:hover,.panel:hover{transform:translateY(-1px)}
.heart{transition:background .15s,color .15s,border-color .15s,transform .12s}
.heart:hover{transform:scale(1.06)}
.heart:active{transform:scale(.96)}
.mode-switch button{transition:background .18s,color .18s,box-shadow .18s}

.overlay{animation:mFadeIn .18s ease backwards}
.modal{animation:mPop .24s cubic-bezier(.2,.85,.35,1.08) backwards}

.auth-card{animation:mFadeScale .4s cubic-bezier(.2,.7,.3,1) backwards}
.auth-side .brand{animation:mFadeUp .45s ease backwards}
.auth-side h1{animation:mFadeUp .5s ease .05s backwards}
.auth-side p{animation:mFadeUp .5s ease .1s backwards}
.auth-side .auth-points li{animation:mFadeUp .45s ease backwards}
.auth-side .auth-points li:nth-child(1){animation-delay:.16s}
.auth-side .auth-points li:nth-child(2){animation-delay:.22s}
.auth-side .auth-points li:nth-child(3){animation-delay:.28s}
.auth-card form{animation:mFadeIn .26s ease backwards}
.auth-tabs button{transition:background .16s,color .16s,box-shadow .16s}
.auth-role button{transition:border-color .16s,background .16s,box-shadow .16s,transform .12s}
.auth-role button:hover{transform:translateY(-1px)}

.progress span{animation:mGrowBar .85s cubic-bezier(.2,.7,.2,1) backwards}
.bell-dot.on{animation:mPulseDot 2.1s ease-in-out infinite}
.compare-dock{animation:mDockIn .26s cubic-bezier(.2,.85,.35,1.08) backwards}
.compare-chips .tag{animation:mFadeIn .2s ease backwards}

.content.no-anim,.content.no-anim *{animation:none!important}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

function loadState(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('matchDemoState'))}catch(e){}
  const base=defaultState();
  let merged=(s&&s.associates&&s.requests)?Object.assign({},base,s):base;
  if(!s||!s.v||s.v<2){merged.session=null;}
  merged.v=3;
  merged.users=Array.isArray(merged.users)?merged.users:[];
  merged.users.forEach(u=>{if(!u.status)u.status='approved';});
  DEMO_ACCOUNTS.forEach(d=>{
    const existing=merged.users.find(u=>u.email===d.email);
    if(existing){existing.status='approved';existing.role=d.role;existing.password=d.password;existing.org=d.org;}
    else merged.users.push({...d,status:'approved'});
  });
  return merged;
}

function doLogin(e){
  e.preventDefault();
  clearAuthErrors();
  const form=e.target;
  const f=new FormData(form);
  const email=(f.get('email')||'').trim().toLowerCase();
  const password=f.get('password')||'';
  let ok=true;
  if(!email){setFieldError('loginEmail','Enter your email address.');ok=false;}
  else if(!isEmail(email)){setFieldError('loginEmail','That doesn’t look like a valid email address.');ok=false;}
  if(!password){setFieldError('loginPass','Enter your password.');ok=false;}
  if(!ok)return;
  const user=(state.users||[]).find(u=>u.email===email);
  if(!user){
    setFieldError('loginEmail','No account found for this email. Create an account or use a demo login below.');
    return;
  }
  if(user.password!==password){
    setFieldError('loginPass','Incorrect password. Try again.');
    return;
  }
  if(user.status==='pending'){openPendingNotice(user);return;}
  if(user.status==='rejected'){openRejectedNotice(user);return;}
  state.pendingLoginEmail=null;
  const sessionUser={
    name: user.role==='client'?(user.org||user.name):user.name,
    email:user.email,
    role:user.role,
    initials:initials(user.name),
    tone:user.role==='associate'?'green':''
  };
  const btn=form.querySelector('button[type="submit"]');
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  signIn(sessionUser);
}
function doRegister(e){
  e.preventDefault();
  clearAuthErrors();
  const form=e.target;
  const f=new FormData(form);
  const name=(f.get('name')||'').trim();
  const email=(f.get('email')||'').trim().toLowerCase();
  const password=f.get('password')||'';
  const confirm=f.get('confirm')||'';
  const role=f.get('role')||'client';
  const org=(f.get('org')||'').trim();
  let ok=true;
  if(!name){setFieldError('regName','Enter your full name.');ok=false;}
  if(!email){setFieldError('regEmail','Enter your email address.');ok=false;}
  else if(!isEmail(email)){setFieldError('regEmail','That doesn’t look like a valid email address.');ok=false;}
  else if((state.users||[]).some(u=>u.email===email)){setFieldError('regEmail','An account with this email already exists. Try signing in instead.');ok=false;}
  if(!password){setFieldError('regPass','Choose a password.');ok=false;}
  else if(password.length<6){setFieldError('regPass','Use at least 6 characters.');ok=false;}
  if(confirm!==password){setFieldError('regConfirm','Passwords do not match.');ok=false;}
  if(!ok)return;
  const user={
    id:'u'+Date.now(),name,email,password,role,org,
    status:'pending',created:new Date().toISOString(),reviewedAt:null

  render();
  showApprovalPending(user);
}

function runCounters(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const contentEl=document.getElementById('content');
  const noAnim=contentEl?contentEl.classList.contains('no-anim'):false;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=Number(el.dataset.count)||0;
    const suffix=el.dataset.suffix||'';
    if(reduce||noAnim){el.textContent=target+suffix;return;}
    const dur=Number(el.dataset.dur)||700;
    const start=performance.now();
    function tick(now){
      const t=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-t,3);
      el.textContent=Math.round(target*eased)+suffix;
      if(t<1)requestAnimationFrame(tick); else el.textContent=target+suffix;
    }
    requestAnimationFrame(tick);
  });
}

/* ============ MATCHING ============ */
function score(a,r){
  if(!r)return null;
  const skills=(r.skills||[r.category]).map(x=>x.toLowerCase());
  const all=a.skills.join(' ').toLowerCase()+' '+a.role.toLowerCase();
  let topic=skills.length?skills.filter(s=>all.includes(s)||a.skills.some(k=>k.toLowerCase().includes(s)||s.includes(k.toLowerCase()))).length/skills.length:0.55;
  topic=Math.min(1,topic+.12);
  let industry=!r.industry||a.industries.some(x=>x.toLowerCase().includes(r.industry.toLowerCase())||r.industry.toLowerCase().includes(x.toLowerCase()))?1:.48;
  let format=!r.format||a.formats.includes(r.format)?1:.55;
  let language=!r.language||a.languages.includes(r.language)?1:.55;
  let budget=!r.budget||a.price<=Number(r.budget)*1.1?1:(a.price<=Number(r.budget)*1.35?.65:.25);
  let availability=/limited/i.test(a.availability)?.65:1;
  let factors=[['Expertise',topic,35],['Industry relevance',industry,20],['Availability',availability,15],['Budget fit',budget,15],['Delivery format',format,10],['Language',language,5]];
  let active=factors.filter((f,i)=>!(i===1&&!r.industry)&&!(i===2&&!r.date)&&!(i===3&&!r.budget)&&!(i===4&&!r.format)&&!(i===5&&!r.language));
  let total=active.reduce((s,f)=>s+f[1]*f[2],0)/active.reduce((s,f)=>s+f[2],0);
  return {value:Math.round(total*100),factors:factors.map(f=>({name:f[0],value:Math.round(f[1]*100),weight:f[2]})).sort((a,b)=>b.value-a.value)};
}
function currentRequest(){return reqById(state.selectedRequest)||state.requests[0]||null}
function filteredAssociates(){
  let r=currentRequest();
  let arr=state.associates.map(a=>({...a,match:score(a,r)}));
  let q=(state.search||'').toLowerCase().trim();
  if(q)arr=arr.filter(a=>(a.name+' '+a.role+' '+a.bio+' '+a.skills.join(' ')+' '+a.industries.join(' ')).toLowerCase().includes(q));
  let f=state.filters||{};
  if(f.industry)arr=arr.filter(a=>a.industries.includes(f.industry));
  if(f.format)arr=arr.filter(a=>a.formats.includes(f.format));
  if(f.language)arr=arr.filter(a=>a.languages.includes(f.language));
  if(f.budget)arr=arr.filter(a=>a.price<=Number(f.budget));
  if(f.sort==='price')arr.sort((a,b)=>a.price-b.price);
  else if(f.sort==='experience')arr.sort((a,b)=>b.experience-a.experience);
  else arr.sort((a,b)=>(b.match?.value||0)-(a.match?.value||0));
  return arr;
}

<div class="grid stats">${stat('Active requests',state.requests.filter(r=>!['Completed','Closed'].includes(r.status)).length,'Across your workspace','▤')}${stat('Saved associates',state.saved.length,'People worth revisiting','♡')}${stat('Enquiries',enquiries,'Sent and received','✉')}${stat('Matches ready',state.requests.filter(r=>r.status==='Reviewing matches').length,'Ready for your review','✳')}</div>
<div class="grid dashboard-grid">
<section class="panel"><div class="panel-head"><div><div class="section-title">Continue your work</div><p>Requests and programmes in progress</p></div><button class="btn quiet small" onclick="go('requests')">View all →</button></div><div class="list">${state.requests.slice(0,4).map(r=>`<div class="list-row"><div class="request-icon">↗</div><div class="list-info"><strong>${esc(r.title)}</strong><span>${esc(r.category)} · ${esc(r.format)} · ${esc(r.created||'Recently created')}</span></div><div class="row-end">${statusPill(r.status)}<div style="margin-top:6px"><button class="btn quiet small" onclick="openRequest('${r.id}')">Open →</button></div></div></div>`).join('')||emptyInline('No requests yet. Create one to get started.')}</div></section>
<section class="panel"><div class="panel-head"><div><div class="section-title">A few worth a look</div><p>Based on common programme needs</p></div><button class="btn quiet small" onclick="go('discover')">Explore →</button></div><div class="list">${state.associates.slice(0,3).map(a=>`<div class="list-row">${avatar(a)}<div class="list-info"><strong>${esc(a.name)}</strong><span>${esc(a.role)}</span></div><button class="btn secondary small" onclick="viewAssociate('${a.id}')">Profile</button></div>`).join('')}</div></section>
</div>
<div class="footnote">MaTCH prototype · Sample people and engagement data are fictional and intended for demonstration.</div>`;
}

function discoverPage(){
  let arr=filteredAssociates();const f=state.filters;
  return `<div class="pagehead"><div><div class="eyebrow">Find the right fit</div><h1>Discover associates</h1><p class="subhead">Explore experienced professionals, compare their strengths, and find people who fit your brief.</p></div><button class="btn primary" onclick="go('newRequest')">＋ Build a brief</button></div>
<div class="searchbar"><input class="search-input" value="${attr(state.search||'')}" placeholder="Try “leadership”, “AI”, or a professional’s name" oninput="state.search=this.value;persist();refreshResults()"><button class="btn secondary" onclick="clearFilters()">Clear filters</button></div>
<div class="filter-row"><select aria-label="Industry filter" onchange="setFilter('industry',this.value)"><option value="">All industries</option>${['Technology','Professional Services','Finance','Manufacturing','Retail','Education','Healthcare','Startups'].map(x=>`<option ${f.industry===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Delivery format filter" onchange="setFilter('format',this.value)"><option value="">Any format</option>${['In-person','Online','Hybrid'].map(x=>`<option ${f.format===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Language filter" onchange="setFilter('language',this.value)"><option value="">Any language</option>${['English','Malay','Mandarin','Arabic','Tamil'].map(x=>`<option ${f.language===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Maximum budget" onchange="setFilter('budget',this.value)"><option value="">Any budget</option><option value="3000" ${f.budget==='3000'?'selected':''}>Up to RM 3,000</option><option value="4000" ${f.budget==='4000'?'selected':''}>Up to RM 4,000</option><option value="5000" ${f.budget==='5000'?'selected':''}>Up to RM 5,000</option></select><select aria-label="Sort results" onchange="setFilter('sort',this.value)"><option value="relevance" ${f.sort!=='price'&&f.sort!=='experience'?'selected':''}>Sort: Best fit</option><option value="price" ${f.sort==='price'?'selected':''}>Price: low to high</option><option value="experience" ${f.sort==='experience'?'selected':''}>Most experience</option></select></div>
<div class="result-head"><span><strong style="color:var(--ink)">${arr.length}</strong> professionals ${currentRequest()?`· ranked against <strong style="color:var(--ink)">${esc(currentRequest().title)}</strong>`:'available in the demo'}</span><button class="btn quiet small" onclick="go('newRequest')">Change brief →</button></div>
<div class="associate-list" id="associateResults">${arr.length?arr.map(associateCard).join(''):emptyState('No associates match these filters','Try removing a filter or broadening your search.','clearFilters()')}</div>
<div class="footnote">Match scores are illustrative and calculated from the selected demo request. They are not a prediction of professional performance.</div>`;
}

function associateCard(a){
  const match=a.match||score(a,currentRequest());
  return `<article class="associate-card">${avatar(a,true)}<div class="associate-main"><div class="name-line"><h3>${esc(a.name)}</h3>${a.verified?'<span class="pill">Profile reviewed</span>':''}</div><div class="role">${esc(a.role)} · ${a.experience} years’ experience</div><p class="bio">${esc(a.bio)}</p><div class="tags">${a.skills.slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}<span class="tag">${esc(a.location.split(',')[0])}</span></div><div class="card-actions"><button class="btn primary small" onclick="viewAssociate('${a.id}')">View profile →</button><button class="btn secondary small" onclick="startEnquiry('${a.id}')">Enquire</button></div></div><div class="card-side"><div style="display:flex;gap:6px"><button class="heart ${state.saved.includes(a.id)?'saved':''}" aria-label="${state.saved.includes(a.id)?'Remove from saved':'Save associate'}" title="${state.saved.includes(a.id)?'Remove saved associate':'Save associate'}" onclick="toggleSave('${a.id}')">${state.saved.includes(a.id)?'♥':'♡'}</button><button class="heart ${state.compare.includes(a.id)?'compared':''}" aria-label="Compare associate" title="Add to comparison" onclick="toggleCompare('${a.id}')">⇄</button></div><div><div class="match-score">${match?match.value+'%':'—'}</div><div class="match-label">Brief fit</div></div><div class="price">${fmt(a.price)}<br><span style="color:var(--muted)">indicative / day</span></div></div></article>`;
}
function refreshResults(){
  const el=document.getElementById('associateResults');
  if(el){
    let arr=filteredAssociates();
    el.innerHTML=arr.length?arr.map(associateCard).join(''):emptyState('No associates match these filters','Try removing a filter or broadening your search.','clearFilters()');
    const count=document.querySelector('.result-head span');
    if(count)count.innerHTML=`<strong style="color:var(--ink)">${arr.length}</strong> professionals · ranked against <strong style="color:var(--ink)">${esc(currentRequest()?.title||'your brief')}</strong>`;
  }
}
function setFilter(k,v){state.filters[k]=v;persist();render()}
function goDiscover(){go('discover')}
function clearFilters(){state.search='';state.filters={industry:'',format:'',language:'',budget:'',sort:'relevance'};persist();render()}
function toggleSave(id){
  if(state.saved.includes(id)){state.saved=state.saved.filter(x=>x!==id);notify('Removed from saved associates.');}
  else{state.saved.push(id);notify('Associate saved to your shortlist.');}
  persist();render();
}

/* ============ COMPARE ============ */
function toggleCompare(id){
  if(state.compare.includes(id)) state.compare=state.compare.filter(x=>x!==id);
  else{
    if(state.compare.length>=3){notify('You can compare up to three associates at once.',true);return;}
    state.compare.push(id);
  }
  persist();render();
}
function clearCompare(){state.compare=[];persist();render();}
function compareDock(){
  const ids=state.compare.filter(id=>assocById(id));
  if(!ids.length)return '';
  return `<div class="compare-dock">
    <span class="compare-count">${ids.length} selected</span>
    <div class="compare-chips">${ids.map(id=>{const a=assocById(id);return `<span class="tag">${esc(a.name.split(' ')[0])}</span>`}).join('')}</div>
    <button class="btn accent small" onclick="openCompare()">Compare →</button>
    <button class="btn secondary small" onclick="clearCompare()">Clear</button>
  </div>`;
}
function openCompare(){
  const list=state.compare.map(assocById).filter(Boolean);
  if(list.length<2){notify('Select at least two associates to compare.',true);return;}
  const r=currentRequest();
  const rows=[
    ['Brief fit',a=>`<strong style="color:var(--green);font-size:15px">${score(a,r).value}%</strong>`],
    ['Role',a=>esc(a.role)],
    ['Experience',a=>a.experience+' years'],
    ['Indicative rate',a=>fmt(a.price)+' <span style="color:var(--muted)">/ day</span>'],
    ['Availability',a=>statusPill(a.availability)],
    ['Location',a=>esc(a.location)],
    ['Formats',a=>a.formats.map(esc).join(' · ')],
    ['Languages',a=>a.languages.map(esc).join(' · ')],
    ['Industries',a=>a.industries.map(esc).join(' · ')],
    ['Key skills',a=>a.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join(' ')]
  ];
  const body=`<div style="overflow:auto"><table class="cmp-table">
    <thead><tr><th></th>${list.map(a=>`<td style="min-width:150px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">${avatar(a)}<strong style="font-size:13px">${esc(a.name)}</strong></div></td>`).join('')}</tr></thead>
    <tbody>
      ${rows.map(([label,fn])=>`<tr><th>${label}</th>${list.map(a=>`<td>${fn(a)}</td>`).join('')}</tr>`).join('')}
      <tr><th></th>${list.map(a=>`<td><button class="btn primary small" onclick="closeModal();viewAssociate('${a.id}')">View profile →</button></td>`).join('')}</tr>
    </tbody></table></div>
    <div class="form-actions"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();startProposal('${list[0].id}')">Request proposal →</button></div>`;
  openModal('Compare associates',body,true);
}

/* ============ REQUEST FLOW ============ */
function requestPage(){
  let d=state.draft||{};
  return `<div class="pagehead"><div><div class="eyebrow">Start with the outcome</div><h1>Create a matching request</h1><p class="subhead">Share the essentials. You can refine the brief later, and optional details help make the recommendations more useful.</p></div></div><div class="panel form-panel"><form onsubmit="submitRequest(event)"><div class="form-section"><h3>01 · What are you trying to achieve?</h3><p>Start with the programme or business outcome, not just a job title.</p><div class="form-grid"><div class="field full"><label for="reqTitle">Request title *</label><input id="reqTitle" name="title" required placeholder="e.g. Leading teams through change" value="${attr(d.title||'')}"></div><div class="field"><label for="reqCategory">Primary expertise *</label><select id="reqCategory" name="category" required><option value="">Choose a focus</option>${['Leadership development','AI literacy','Business communication','Project management','Customer experience','Entrepreneurship & innovation','Team development','Sales & negotiation','Operational excellence','Learning design','Cybersecurity awareness'].map(x=>`<option ${d.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="reqIndustry">Industry</label><select id="reqIndustry" name="industry"><option value="">Not industry-specific</option>${['Technology','Professional Services','Finance','Manufacturing','Retail','Education','Healthcare','Startups'].map(x=>`<option ${d.industry===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label for="reqSummary">Brief context *</label><textarea id="reqSummary" name="summary" required placeholder="What should participants understand, do, or be able to do differently after this engagement?">${esc(d.summary||'')}</textarea></div></div></div>
<div class="form-section"><h3>02 · Practical requirements</h3><p>These details help distinguish a good fit from a great one.</p><div class="form-grid"><div class="field"><label for="reqFormat">Delivery format *</label><select id="reqFormat" name="format" required><option value="">Choose a format</option>${['In-person','Online','Hybrid'].map(x=>`<option ${d.format===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="reqLocation">Location</label><input id="reqLocation" name="location" placeholder="e.g. Kuala Lumpur" value="${attr(d.location||'')}"></div><div class="field"><label for="reqDate">Preferred timing</label><select id="reqDate" name="date">${['Flexible','Available next week','November 2026','December 2026','Within 2 months'].map(x=>`<option ${d.date===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="reqBudget">Indicative budget (RM/day)</label><select id="reqBudget" name="budget"><option value="">Not set yet</option>${['2500','3000','3500','4000','4500','5000','6000'].map(x=>`<option value="${x}" ${String(d.budget||'')===x?'selected':''}>Up to RM ${Number(x).toLocaleString()}</option>`).join('')}</select></div><div class="field"><label for="reqLanguage">Preferred language</label><select id="reqLanguage" name="language"><option value="">No preference</option>${['English','Malay','Mandarin','Arabic','Tamil'].map(x=>`<option ${d.language===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="reqAudience">Audience size</label><select id="reqAudience" name="audience">${['Not sure','Up to 10','11–20','21–40','40+'].map(x=>`<option ${String(d.audience||'')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="reqDuration">Engagement duration</label><select id="reqDuration" name="duration">${['Half day','1 day','2 days','Multi-session programme','Ongoing coaching','Not decided'].map(x=>`<option ${d.duration===x?'selected':''}>${x}</option>`).join('')}</select></div></div></div><div class="form-actions"><button type="button" class="btn secondary" onclick="go('dashboard')">Cancel</button><button type="submit" class="btn primary">Find my matches →</button></div></form></div>`;
}
function submitRequest(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const title=f.get('title').trim();
  const category=f.get('category');
  const skills=[category];
  let existing=state.draft?.id?reqById(state.draft.id):null;
  const r={id:existing?.id||'r'+Date.now(),title,category,industry:f.get('industry'),format:f.get('format'),location:f.get('location'),date:f.get('date'),budget:f.get('budget')?Number(f.get('budget')):null,language:f.get('language'),audience:f.get('audience'),duration:f.get('duration'),summary:f.get('summary').trim(),skills,status:'Reviewing matches',created:'16 Oct 2026'};
  if(existing)Object.assign(existing,r);else state.requests.unshift(r);
  state.selectedRequest=r.id;state.draft=null;state.page='matches';
  pushNotification(`Brief “${title}” is ready — ${state.associates.length} associates ranked.`,'matches');
  persist();render();
  notify('Your brief is ready. Review the suggested matches.');
}
function nextStatus(s){const i=STATUS_FLOW.indexOf(s);return i<0||i>=STATUS_FLOW.length-1?null:STATUS_FLOW[i+1]}
function advanceStatus(id){
  const r=reqById(id); if(!r)return;
  const next=nextStatus(r.status); if(!next)return;
  r.status=next;
  pushNotification(`Request “${r.title}” moved to ${next}.`,'requests');
  persist();closeModal();render();notify(`Request status updated to ${next}.`);
}

/* ============ MATCHES / SAVED ============ */
function matchesPage(){
  let r=currentRequest();
  if(!r)return `<div class="pagehead"><div><div class="eyebrow">Recommendations</div><h1>Your matches</h1><p>Create a brief to see relevant professionals.</p></div><button class="btn primary" onclick="go('newRequest')">Create request</button></div>`;
  let arr=state.associates.map(a=>({...a,match:score(a,r)})).sort((a,b)=>b.match.value-a.match.value);
  const strongCount=arr.filter(a=>a.match.value>=75).length;
  return `<div class="pagehead"><div><div class="eyebrow">Recommendations for your brief</div><h1>Your matches</h1><p class="subhead">A shortlist ranked against your requirements, with the reasoning visible so you can make your own judgement.</p></div><button class="btn secondary" onclick="editRequest('${r.id}')">Edit brief</button></div><div class="feature-banner"><div><div class="eyebrow">Current brief</div><h2>${esc(r.title)}</h2><p>${esc(r.summary)} </p><div class="tags" style="margin-top:13px"><span class="tag">${esc(r.format||'Any format')}</span><span class="tag">${esc(r.industry||'Any industry')}</span><span class="tag">${r.budget?fmt(r.budget)+' / day':'Budget flexible'}</span></div></div><div><div class="stat-num" style="font-size:36px" data-count="${strongCount}">${strongCount}</div><div class="stat-foot">strong fits in this demo</div></div></div><div class="result-head"><span><strong style="color:var(--ink)">${arr.length}</strong> associates ranked by brief fit</span><span>Demo scoring · transparent factors</span></div><div class="associate-list">${arr.map(a=>associateCard(a)).join('')}</div><div class="footnote">Scores are deterministic estimates based on demo profile data and the criteria provided. They do not guarantee outcomes or replace professional evaluation.</div>`;
}
function savedPage(){
  let arr=state.associates.filter(a=>state.saved.includes(a.id));
  return `<div class="pagehead"><div><div class="eyebrow">Your shortlist</div><h1>Saved associates</h1><p class="subhead">Keep promising people close while you compare experience, fit, and availability.</p></div><button class="btn primary" onclick="go('discover')">Discover more →</button></div>${arr.length?`<div class="associate-list">${arr.map(a=>associateCard({...a,match:score(a,currentRequest())})).join('')}</div>`:emptyState('Your shortlist is empty','Save associates while browsing to return to them here.','goDiscover()')}`;
}

/* ============ ASSOCIATE PROFILE ============ */
function viewAssociate(id){
  state.selectedAssociate=id;
  state.viewed=[id,...(state.viewed||[]).filter(x=>x!==id)].slice(0,5);
  persist();
  renderNav();
  document.getElementById('crumb').textContent=`${state.mode==='client'?'Client workspace':'Associate workspace'} / Profile`;
  const c=document.getElementById('content');
  c.classList.remove('no-anim');
  c.innerHTML=associateProfilePage(id);
  lastRenderKey='';
  runCounters();
  document.getElementById('mobileBrand').style.display=innerWidth<=760?'flex':'none';
  document.getElementById('compareDock').innerHTML=compareDock();
}
function reviewsFor(a){
  const first=a.name.split(' ')[0];
  const s1=a.skills[0]||'facilitation';
  const s2=a.skills[1]||s1;
  return [
    {name:'Nurul A.', role:'Head of People', org:a.industries[0]||'Professional Services', rating:5, date:'Aug 2026', text:`${first} worked closely with our team on ${s1.toLowerCase()}. The sessions were practical, well paced, and gave us clear next steps we actually used.`},
    {name:'Marcus T.', role:'Programme Lead', org:a.industries[1]||a.industries[0]||'Technology', rating:5, date:'May 2026', text:`Clear, thoughtful and easy to work with. Our managers left with a shared language for ${s2.toLowerCase()} and a plan for the following quarter.`},
    {name:'Siew L.', role:'Operations Director', org:a.industries[2]||a.industries[0]||'Manufacturing', rating:4, date:'Feb 2026', text:`Strong facilitation and a good balance of theory and practice. Would engage again for future ${s1.toLowerCase()} work.`}
  ];
}

  return `<div class="pagehead"><div><button class="btn quiet small" onclick="go('discover')">← Back to discovery</button><div class="eyebrow" style="margin-top:14px">Associate profile</div><h1>Get to know the person behind the expertise.</h1></div></div>

    <section class="panel" style="margin-top:16px"><div class="section-title">About ${esc(a.name.split(' ')[0])}</div><p class="prose" style="margin:12px 0 0">${esc(a.bio)}</p><div style="margin-top:24px"><div class="section-title">Areas of expertise</div><div class="skill-list">${a.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div><div style="margin-top:24px"><div class="section-title">Industry experience</div><div class="skill-list">${a.industries.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div><div style="margin-top:24px"><div class="section-title">Delivery and languages</div><p class="prose" style="margin:8px 0">${a.formats.map(esc).join(' · ')}<br>${a.languages.map(esc).join(' · ')}</p></div></section>
    <section class="panel" style="margin-top:16px"><div class="panel-head"><div><div class="section-title">Client feedback</div><p>Sample feedback from previous demo engagements</p></div><span class="pill">★ ${a.rating.toFixed(1)} · ${a.programmes} programmes</span></div><div>${reviewsFor(a).map(r=>`<div class="review"><div class="avatar">${initials(r.name)}</div><div style="flex:1;min-width:0"><div class="review-head"><div><strong>${esc(r.name)}</strong> <span style="color:var(--muted)">· ${esc(r.role)}, ${esc(r.org)}</span></div><div class="stars" title="${r.rating} out of 5">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div></div><p>${esc(r.text)}</p></div></div>`).join('')}</div></section>

/* ============ ENQUIRIES ============ */
function startEnquiry(id){
  const a=assocById(id);if(!a)return;
  openModal(`Enquire with ${a.name}`,`<p>Send a sample enquiry linked to your current brief. Nothing will be sent outside this demo.</p><form onsubmit="submitEnquiry(event,'${id}')"><div class="field"><label for="enqRequest">Related request</label><select id="enqRequest" name="requestId">${state.requests.map(r=>`<option value="${r.id}" ${r.id===state.selectedRequest?'selected':''}>${esc(r.title)}</option>`).join('')}</select></div><div class="field" style="margin-top:14px"><label for="enqMessage">Message *</label><textarea id="enqMessage" name="message" required placeholder="Share what you would like to explore together.">Hello ${esc(a.name.split(' ')[0])}, your experience looks relevant to our programme. Could we discuss your approach and availability?</textarea></div><div class="form-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Send demo enquiry</button></div></form>`);
}
function submitEnquiry(e,id){
  e.preventDefault();

function openProposalResponse(id,decision){
  const p=state.proposals.find(x=>x.id===id); if(!p)return;

    ? 'Thank you — I would be glad to take this on. I can confirm availability and share a short outline before we begin.'

  openModal(label,`<p>This response will be recorded in the demo workspace.</p><form onsubmit="submitProposalResponse(event,'${id}','${decision}')"><div class="field"><label for="propResp">Response *</label><textarea id="propResp" name="response" required>${preset}</textarea></div><div class="form-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${label}</button></div></form>`);

function submitProposalResponse(e,id,decision){
  e.preventDefault();
  const p=state.proposals.find(x=>x.id===id); if(!p)return;
  p.status=decision;
  p.response=new FormData(e.target).get('response').trim();

  pushNotification(`Proposal ${decision.toLowerCase()} for “${r?.title||'a brief'}”.`,'requests');
  persist();closeModal();render();
  notify(`Proposal ${decision.toLowerCase()}.`);
}

/* ============ MODAL ============ */
function openModal(title,body,wide){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="modal-head"><div><h2>${esc(title)}</h2></div><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div>${body}</section></div>`;
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
window.addEventListener('resize',()=>{document.getElementById('mobileBrand').style.display=innerWidth<=760?'flex':'none'});
render();
